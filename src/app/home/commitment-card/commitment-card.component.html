<div class="container justify-content-center">
  <div class="row">
    <div class="col-12 offset-lg-1 d-flex justify-content-center commitment">
      <img [src]="this.commitment.iconFilePath()" [ngClass]="this.commitment.iconSizeClassName">
    </div>
    <div class="col-12 col-lg-8 offset-lg-1 text-center">
      <h5>{{ this.commitment.title }}</h5>
    </div>
  </div>
</div>
